    <style>
        .hub { max-width: 1120px; margin: 0 auto; padding: 2rem 1rem 4rem; }
        .hub-nav { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: space-between; margin-bottom: 1rem; }
        .hub-nav a { font-weight: 800; }
        .search { width: 100%; min-height: 2.7rem; padding: .7rem .9rem; border: 1px solid var(--doc-line); border-radius: 8px; background: var(--doc-surface); color: var(--doc-text); font: inherit; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: .9rem; margin-top: 1rem; }
        .doc-card { display: block; padding: 1rem; border: 1px solid var(--doc-line); border-radius: 8px; background: var(--doc-surface); box-shadow: var(--doc-shadow); }
        .doc-card span { color: var(--doc-blue); font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; }
        .doc-card strong { display: block; margin: .55rem 0 .2rem; color: var(--doc-text); }
        .doc-card p { margin: 0; }

</head>
<body class="doc-page">
    <main class="hub">
        <nav class="hub-nav"><a href="../index_zh.html">返回总入口</a><a href="index.html">English</a></nav>
        <p class="eyebrow">LiteRTDemo Documentation</p>

    <script>
        const input = document.getElementById('docSearch');
        const cards = Array.from(document.querySelectorAll('.doc-card'));
        input.addEventListener('input', () => {
            const q = input.value.trim().toLowerCase();
            cards.forEach(card => { card.style.display = !q || card.dataset.search.toLowerCase().includes(q) ? '' : 'none'; });
        });
    </script>
